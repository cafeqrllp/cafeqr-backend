name: Deploy Production Backend

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # ── Checkout ──
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Docker Login ──
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Build Metadata ──
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      # ── Setup BuildX (required for GHA cache) ──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Build & Push ──
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Deploy to Oracle Cloud VPS ──
      - name: Deploy to Oracle Cloud VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          command_timeout: 15m
          script: |
            set -euo pipefail
            
            APP_DIR="/home/ubuntu/cafeqr-production/cafeqr-backend"
            COMPOSE_FILE="docker-compose.prod.yml"
            
            # If the .env file is actually in the parent directory, use the parent directory's docker-compose.yml
            if [ ! -f "$APP_DIR/.env" ] && [ -f "/home/ubuntu/cafeqr-production/.env" ]; then
              echo "Found .env in parent directory. Switching to parent directory deployment."
              APP_DIR="/home/ubuntu/cafeqr-production"
              COMPOSE_FILE="docker-compose.yml"
            fi
            
            echo "Navigating to app directory: $APP_DIR"
            cd "$APP_DIR"
            
            # Log in to GHCR on the Oracle server to pull the package
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull the new backend image using Docker Compose V2 if available, to avoid V1 'ContainerConfig' bug
            if sudo docker compose version &> /dev/null; then
              sudo docker compose -f "$COMPOSE_FILE" pull backend
              sudo docker compose -f "$COMPOSE_FILE" up -d --no-deps --force-recreate backend
            elif command -v docker-compose &> /dev/null; then
              sudo docker-compose -f "$COMPOSE_FILE" pull backend
              sudo docker-compose -f "$COMPOSE_FILE" up -d --no-deps --force-recreate backend
            else
              echo "Error: Neither docker compose nor docker-compose found."
              exit 1
            fi
            
            # Clean up old unused images to save disk space
            sudo docker image prune -f
